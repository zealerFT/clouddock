name: Publish macOS app

on:
  push:
    tags:
      - 'v[0-9]*'
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'Sources/**'
      - 'Package.swift'
      - 'version.json'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.5.7)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Check version and architecture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          version=$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$RELEASE_TAG" == "v$version" ]]
          fi
          test -f "docs/releases/v$version.md"
          python3 scripts/check-public-files.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch verified transfer engine
        run: python3 scripts/fetch-rclone.py

      - name: Run core checks
        run: swift run CloudDockChecks

      - name: Run isolated S3 integration checks
        run: |
          python3 -m venv .qa-venv
          .qa-venv/bin/python -m pip install -r requirements-qa.txt
          python3 scripts/integration-test.py

      - name: Build Apple Silicon installers
        shell: bash
        run: |
          set -o pipefail
          if bash scripts/package.sh --no-install 2>&1 | tee "$RUNNER_TEMP/clouddock-package.log"; then
            exit 0
          else
            status=$?
            python3 - "$RUNNER_TEMP/clouddock-package.log" <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          message = '\n'.join(lines[-80:])[-12000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Installer build failed::' + message)
          PY
            exit "$status"
          fi

      - name: Verify release archives
        run: python3 scripts/verify-release.py

      - name: Publish downloadable app
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > dist/release-is-draft.txt 2>/dev/null; then
            [[ "$(cat dist/release-is-draft.txt)" == true ]] || { echo 'This version is already published.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "CloudDock $version" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/CloudDock-$version-arm64.dmg" \
            "dist/CloudDock-$version-arm64.zip" \
            "dist/CloudDock-$version-source.zip" \
            dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
