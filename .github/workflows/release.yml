name: Publish macOS app

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.5.7)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check version and architecture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(uname -m)" == arm64 ]]
          version=$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')
          [[ "$RELEASE_TAG" == "v$version" ]]
          test -f "docs/releases/$RELEASE_TAG.md"
          python3 scripts/check-public-files.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch verified transfer engine
        run: python3 scripts/fetch-rclone.py

      - name: Run core checks
        run: swift run CloudDockChecks

      - name: Run isolated S3 integration checks
        run: |
          python3 -m venv .qa-venv
          .qa-venv/bin/python -m pip install -r requirements-qa.txt
          python3 scripts/integration-test.py

      - name: Build Apple Silicon installers
        run: bash scripts/package.sh --no-install

      - name: Verify release archives
        run: python3 scripts/verify-release.py

      - name: Publish downloadable app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > dist/release-is-draft.txt 2>/dev/null; then
            [[ "$(cat dist/release-is-draft.txt)" == true ]] || { echo 'This version is already published.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "CloudDock $version" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/CloudDock-$version-arm64.dmg" \
            "dist/CloudDock-$version-arm64.zip" \
            "dist/CloudDock-$version-source.zip" \
            dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
